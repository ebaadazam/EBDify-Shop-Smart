spring.application.name=ebdify

# Database configurations
spring.datasource.url=jdbc:mysql://localhost:3306/ebdify
spring.datasource.username=root
spring.datasource.password=ebaad
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL related configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Directory where images will be stored
project.image=images/

# JWT Secret key and expiration
spring.app.jwtSecret=ebdifySecretKey090920027668046325ebaad82881
spring.app.jwtExpirationMs=3000000

# Logging
logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.example.securitydemo=DEBUG

# Cookie
spring.ecom.app.jwtCookieName=ebdify

# Frontend URL
frontend.url=http://localhost:5173/

image.base.url=http://localhost:8080/images










